openapi: 3.0.3
info:
  title: Paperoo API
  description: |
    # Paperoo - Task Printer API
    
    Die Paperoo API ermöglicht es, Aufgaben direkt auf Bondruckern auszugeben. 
    Die API bietet Endpunkte zum Drucken von Aufgaben, Verwalten der Warteschlange 
    und Überwachen des Druckerstatus.
    
    ## Authentifizierung
    
    Die API akzeptiert Bearer Token oder den X-API-Key-Header. URL-Parameter sind nicht erlaubt:
    
    ```
    Authorization: Bearer your-api-key-here
    X-API-Key: your-api-key-here
    ```
    
    ## Basis-URL
    
    ```
    http://localhost:5001
    ```
    
    ## Rate Limiting
    
    Aktuell gibt es kein Rate Limiting, dies kann sich in zukünftigen Versionen ändern.
    
  version: 1.0.8
  contact:
    name: Paperoo Support
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5001
    description: Lokaler Entwicklungsserver
  - url: http://192.168.1.95:5001
    description: Netzwerk Server
  - url: https://paperoo.example.com
    description: Produktionsserver (HTTPS empfohlen)

tags:
  - name: Print
    description: Aufgaben drucken
  - name: Queue
    description: Warteschlangen-Verwaltung
  - name: Status
    description: System- und Druckerstatus
  - name: Configuration
    description: Drucker- und Systemkonfiguration

security:
  - BearerAuth: []
  - ApiKeyAuth: []

paths:
  /api/print:
    post:
      tags:
        - Print
      summary: Dokument drucken
      description: |
        Erstellt einen Druckauftrag und versucht diesen sofort zu drucken.
        Falls der Drucker offline ist, wird der Auftrag in die Warteschlange eingereiht.
        Der Typ wird über type gewählt; ohne oder mit unbekanntem Typ wird ein To-do gedruckt.
      operationId: printTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: Text, zeilenweise Listeneinträge oder QR-Inhalt; bei Bildern optional als Beschriftung. Eine Zeile mit „# Überschrift“ beginnt in Listen eine Gruppe.
                  example: "Dokumentation fertigstellen"
                  maxLength: 500
                type:
                  type: string
                  description: Druck-Typ (Standard und Rückfall bei unbekannten Werten ist todo)
                  enum: [todo, list, note, quote, image, qr, receipt]
                  default: todo
                title:
                  type: string
                  description: Optionaler Titel einer Einkaufsliste
                list_name:
                  type: string
                  description: Alternative Bezeichnung für title
                author:
                  type: string
                  description: Optionaler Autor eines Zitats
                image:
                  type: string
                  format: byte
                  description: Base64-kodiertes Bild oder Data-URL; bei Typ image erforderlich
                qr_size:
                  type: integer
                  minimum: 1
                  maximum: 16
                  default: 8
                  description: Modulgröße des QR-Codes; Werte außerhalb des Bereichs werden begrenzt
                priority:
                  type: integer
                  description: Prioritätsstufe des To-dos
                  minimum: 1
                  maximum: 5
                  default: 3
                  example: 4
                language:
                  type: string
                  description: Sprache für den Ausdruck (überschreibt Standardsprache)
                  enum: [de, en]
                  default: de
                  example: de
            examples:
              simple:
                summary: Einfache Aufgabe
                value:
                  text: "Einkaufen gehen"
              priority:
                summary: Aufgabe mit Priorität
                value:
                  text: "Wichtiges Meeting vorbereiten"
                  priority: 5
              english:
                summary: Englische Aufgabe
                value:
                  text: "Complete documentation"
                  priority: 4
                  language: en
      responses:
        '200':
          description: Aufgabe erfolgreich verarbeitet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintResponse'
              examples:
                printed:
                  summary: Erfolgreich gedruckt
                  value:
                    success: true
                    message: "ToDo printed successfully"
                    data:
                      id: 123
                      text: "Dokumentation fertigstellen"
                      priority: 4
                      language: de
                      queued: false
                queued:
                  summary: In Warteschlange eingereiht
                  value:
                    success: true
                    message: "Saved to queue for retry: Printer offline"
                    data:
                      id: 124
                      text: "Einkaufen gehen"
                      priority: 3
                      language: de
                      queued: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/system/update/status:
    get:
      tags:
        - Configuration
      summary: Update-Status lesen
      description: Browser-Endpunkt mit Websession; liefert installierte Version und letzten Update-Job.
      operationId: getSystemUpdateStatus
      security: []
      responses:
        '200':
          description: Update-Status
        '401':
          description: Anmeldung erforderlich

  /api/system/update/check:
    post:
      tags:
        - Configuration
      summary: GitHub-Update prüfen
      description: Vergleicht lokale und entfernte Version sowie Commits; erfordert Websession und CSRF-Token.
      operationId: checkSystemUpdate
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Versions- und Commit-Vergleich
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig
        '502':
          description: GitHub oder Git ist nicht erreichbar

  /api/system/update/install:
    post:
      tags:
        - Configuration
      summary: GitHub-Update installieren
      description: Startet Backup und Fast-forward-Update im Hintergrund; erfordert Websession und CSRF-Token.
      operationId: installSystemUpdate
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Update gestartet
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig
        '409':
          description: Ein anderes Update läuft bereits

  /api/settings/api-keys:
    get:
      tags:
        - Configuration
      summary: API-Schlüssel und Statistik lesen
      description: Liefert Kommentare, Präfixe, Nutzungszahlen, letzte Verwendung und Druckaufträge nach Typ, jedoch keine Schlüssel oder Hashes. Websession erforderlich.
      operationId: getManagedApiKeys
      security: []
      responses:
        '200':
          description: Verwaltete API-Schlüssel mit Statistik
        '401':
          description: Anmeldung erforderlich
    post:
      tags:
        - Configuration
      summary: API-Schlüssel erstellen
      description: Erstellt einen Schlüssel mit Kommentar. Nur diese Antwort enthält den Klartextschlüssel; gespeichert werden SHA-256-Hash und Präfix. Websession und CSRF-Token sind erforderlich.
      operationId: createManagedApiKey
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  maxLength: 200
                  example: iPhone
      responses:
        '201':
          description: Schlüssel erstellt; api_key nur in dieser Antwort im Klartext
        '400':
          description: Kommentar fehlt oder ist ungültig
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig

  /api/settings/api-keys/{keyId}:
    delete:
      tags:
        - Configuration
      summary: API-Schlüssel deaktivieren
      description: Deaktiviert einen benutzerdefinierten Schlüssel, behält aber Statistik und Protokoll. Der Standard-Schlüssel aus .env kann nicht deaktiviert werden. Websession und CSRF-Token sind erforderlich.
      operationId: revokeManagedApiKey
      security: []
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: integer
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Schlüssel deaktiviert
        '400':
          description: Bereits inaktiv oder Standard-Schlüssel
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig

  /api/settings/print-log:
    get:
      tags:
        - Configuration
      summary: Druckprotokoll lesen
      description: Liefert Zeitpunkt, Schlüsselkommentar, Druckart, Text oder Bildunterschrift, Zusatzfelder und Annahmestatus. Keine Bilddaten oder Schlüssel. Websession erforderlich.
      operationId: getPrintLog
      security: []
      parameters:
        - name: key_id
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: Druckprotokoll, neueste Einträge zuerst
        '400':
          description: Ungültiger Filter
        '401':
          description: Anmeldung erforderlich

  /api/settings:
    get:
      tags:
        - Configuration
      summary: Web-Einstellungen lesen
      description: Liefert öffentliche Konfigurationswerte und ob Geheimnisse gespeichert sind, aber niemals die Geheimnisse selbst. Websession erforderlich.
      operationId: getWebSettings
      security: []
      responses:
        '200':
          description: Aktuelle Zugangs-, KI- und MQTT-Einstellungen
        '401':
          description: Anmeldung erforderlich

  /api/settings/auth:
    post:
      tags:
        - Configuration
      summary: Zugangseinstellungen speichern
      description: Ändert Passwortschutz, Benutzername, Passwort und Sitzungszeiten. Bei aktivem Schutz ist current_password erforderlich; Websession und CSRF-Token sind erforderlich.
      operationId: updateAuthSettings
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                username:
                  type: string
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 12
                password_confirmation:
                  type: string
                  format: password
                session_timeout:
                  type: integer
                  minimum: 5
                  maximum: 10080
                remember_me_days:
                  type: integer
                  minimum: 1
                  maximum: 365
      responses:
        '200':
          description: Zugangseinstellungen gespeichert
        '400':
          description: Ungültige oder unvollständige Einstellungen
        '401':
          description: Anmeldung erforderlich
        '403':
          description: Aktuelles Passwort oder CSRF-Token ist ungültig

  /api/settings/motivation:
    post:
      tags:
        - Configuration
      summary: Motivationseinstellungen speichern
      description: Speichert Anbieter, Modell, Basis-URL und API-Schlüssel. Ein leerer API-Schlüssel bleibt unverändert, sofern clear_api_key nicht gesetzt ist. Websession und CSRF-Token sind erforderlich.
      operationId: updateMotivationSettings
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum: [openai, anthropic, openrouter, local]
                enabled:
                  type: boolean
                settings:
                  type: object
                  properties:
                    base_url:
                      type: string
                      format: uri
                    model:
                      type: string
                    api_key:
                      type: string
                      format: password
                    clear_api_key:
                      type: boolean
      responses:
        '200':
          description: Einstellungen gespeichert
        '400':
          description: Ungültige Einstellungen oder fehlender API-Schlüssel
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig

  /api/settings/mqtt:
    post:
      tags:
        - Configuration
      summary: MQTT-Einstellungen speichern
      description: Speichert Broker, Zugangsdaten, Topics, JSON-Payloads und Zeitwerte. Ein leeres Passwort bleibt unverändert, sofern clear_password nicht gesetzt ist. Websession und CSRF-Token sind erforderlich.
      operationId: updateMqttSettings
      security: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                broker:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                username:
                  type: string
                password:
                  type: string
                  format: password
                clear_password:
                  type: boolean
                topic_before_print:
                  type: string
                payload_before_print:
                  type: string
                wait_seconds:
                  type: integer
                  minimum: 0
                  maximum: 300
                timeout_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                topic_after_timeout:
                  type: string
                payload_after_timeout:
                  type: string
      responses:
        '200':
          description: MQTT-Einstellungen gespeichert
        '400':
          description: Ungültige Einstellungen oder ungültiges JSON-Payload
        '401':
          description: Anmeldung erforderlich
        '403':
          description: CSRF-Token fehlt oder ist ungültig

  /api/status:
    get:
      tags:
        - Status
      summary: System- und Druckerstatus
      description: Liefert den aktuellen Status des Druckers und der Systemkonfiguration
      operationId: getStatus
      responses:
        '200':
          description: Status erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                success: true
                data:
                  printer_configured: true
                  mqtt_enabled: false
                  mqtt_connected: false
                  printer_active: false
                  last_print_time: "2024-01-20T10:30:00"
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/queue/status:
    get:
      tags:
        - Queue
      summary: Warteschlangen-Statistiken
      description: |
        Liefert detaillierte Statistiken über die Druckwarteschlange, 
        einschließlich der Anzahl gedruckter, wartender und fehlgeschlagener Aufgaben.
      operationId: getQueueStatus
      responses:
        '200':
          description: Warteschlangen-Status erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueStatusResponse'
              example:
                success: true
                data:
                  total: 150
                  pending: 2
                  printed: 145
                  failed: 3
                  today: 12
                  queue_running: true
                  retry_interval: 30
                  max_attempts: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/queue/todos:
    get:
      tags:
        - Queue
      summary: Letzte Aufgaben abrufen
      description: Liefert eine Liste der zuletzt erstellten Aufgaben mit ihrem Status
      operationId: getRecentTodos
      parameters:
        - name: limit
          in: query
          description: Maximale Anzahl zurückzugebender Aufgaben
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 20
      responses:
        '200':
          description: Aufgabenliste erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/queue/pending:
    get:
      tags:
        - Queue
      summary: Wartende Aufgaben abrufen
      description: Liefert alle Aufgaben, die noch auf den Druck warten
      operationId: getPendingTodos
      responses:
        '200':
          description: Liste wartender Aufgaben
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/queue/retry:
    post:
      tags:
        - Queue
      summary: Fehlgeschlagene Aufgaben wiederholen
      description: |
        Setzt alle fehlgeschlagenen Aufgaben zurück und versucht sie erneut zu drucken.
        Dies ist nützlich, wenn der Drucker nach einem Fehler wieder verfügbar ist.
      operationId: retryFailed
      responses:
        '200':
          description: Wiederholung erfolgreich gestartet
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Reset 3 failed todos for retry"
                  count:
                    type: integer
                    description: Anzahl der zurückgesetzten Aufgaben
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /health:
    get:
      tags:
        - Status
      summary: Health Check
      description: Einfacher Health Check Endpunkt für Monitoring
      operationId: healthCheck
      security: []  # Kein API-Key erforderlich
      responses:
        '200':
          description: Service ist gesund
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: "Paperoo Server"
                  mqtt_enabled:
                    type: boolean
                    example: false
                  mqtt_connected:
                    type: boolean
                    example: false
                  env_watching:
                    type: boolean
                    example: true

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer Token Authentifizierung mit API-Key
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API-Key im X-API-Key-Header

  schemas:
    PrintResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Ob die Operation erfolgreich war
        message:
          type: string
          description: Statusnachricht
        data:
          type: object
          properties:
            id:
              type: integer
              description: Eindeutige ID der Aufgabe
            text:
              type: string
              description: Der Aufgabentext
            priority:
              type: integer
              description: Prioritätsstufe (1-5)
            language:
              type: string
              description: Verwendete Sprache
            type:
              type: string
              description: Tatsächlich verwendeter Druck-Typ
              enum: [todo, list, note, quote, image, qr, receipt]
            queued:
              type: boolean
              description: Ob die Aufgabe in die Warteschlange eingereiht wurde

    StatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            version:
              type: string
              description: Paperoo-Server-Version
              example: 1.0.5
            printer_configured:
              type: boolean
              description: Ob ein Drucker konfiguriert ist
            mqtt_enabled:
              type: boolean
              description: Ob MQTT aktiviert ist
            mqtt_connected:
              type: boolean
              description: Ob MQTT verbunden ist
            printer_active:
              type: boolean
              description: Ob der Drucker aktiv ist
            last_print_time:
              type: string
              format: date-time
              description: Zeitpunkt des letzten Drucks
              nullable: true

    QueueStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            total:
              type: integer
              description: Gesamtanzahl aller Aufgaben
            pending:
              type: integer
              description: Anzahl wartender Aufgaben
            printed:
              type: integer
              description: Anzahl erfolgreich gedruckter Aufgaben
            failed:
              type: integer
              description: Anzahl fehlgeschlagener Aufgaben
            today:
              type: integer
              description: Heute gedruckte Aufgaben
            queue_running:
              type: boolean
              description: Ob die Warteschlange aktiv ist
            retry_interval:
              type: integer
              description: Sekunden zwischen Wiederholungsversuchen
            max_attempts:
              type: integer
              description: Maximale Anzahl von Druckversuchen

    TodoListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Todo'

    Todo:
      type: object
      properties:
        id:
          type: integer
          description: Eindeutige ID
        text:
          type: string
          description: Aufgabentext
        priority:
          type: integer
          description: Priorität (1-5)
        status:
          type: string
          enum: [pending, printed, failed]
          description: Aktueller Status
        created_at:
          type: string
          format: date-time
          description: Erstellungszeitpunkt
        printed_at:
          type: string
          format: date-time
          description: Druckzeitpunkt
          nullable: true
        print_attempts:
          type: integer
          description: Anzahl der Druckversuche
        error_message:
          type: string
          description: Fehlermeldung bei fehlgeschlagenem Druck
          nullable: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Fehlerkategorie
        message:
          type: string
          description: Detaillierte Fehlermeldung

  responses:
    BadRequest:
      description: Ungültige Anfrage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "No data provided"
            message: "Please provide JSON data with text and priority"

    Unauthorized:
      description: Authentifizierung fehlgeschlagen
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Invalid API key"
            message: "The provided API key is invalid"

    ServerError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Server error"
            message: "An internal server error occurred"